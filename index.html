<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPIDER by Erlangga — AI Agent Observability</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='14' r='6' fill='%2335e0ff'/%3E%3Ccircle cx='16' cy='24' r='4' fill='%2335e0ff'/%3E%3C/svg%3E">
</head>
<body>

<header id="topbar">
  <div id="brand">
    <svg id="spiderMark" viewBox="0 0 48 48" width="30" height="30" aria-label="SPIDER status">
      <g class="spider-legs" stroke="#35e0ff" stroke-width="2" fill="none" stroke-linecap="round">
        <line x1="14" y1="16" x2="4" y2="10"/><line x1="14" y1="22" x2="3" y2="22"/>
        <line x1="14" y1="28" x2="4" y2="34"/><line x1="34" y1="16" x2="44" y2="10"/>
        <line x1="34" y1="22" x2="45" y2="22"/><line x1="34" y1="28" x2="44" y2="34"/>
      </g>
      <ellipse cx="24" cy="18" rx="7" ry="8" fill="#0a1620" stroke="#35e0ff" stroke-width="2"/>
      <ellipse cx="24" cy="32" rx="5" ry="7" fill="#0a1620" stroke="#35e0ff" stroke-width="2"/>
      <circle cx="21.5" cy="16" r="1.6" fill="#ff4fd8"/><circle cx="26.5" cy="16" r="1.6" fill="#ff4fd8"/>
    </svg>
    <div id="brandText">
      <span id="brandName">SPIDER</span>
      <span id="brandBy">by Erlangga</span>
    </div>
    <span id="agentStatus" class="idle">IDLE</span>
  </div>
  <div id="statsbar">
    <div class="stat"><span class="num" id="stTools">0</span><span class="lbl">TOOLS</span></div>
    <div class="stat"><span class="num" id="stNodes">0</span><span class="lbl">NODES</span></div>
    <div class="stat"><span class="num" id="stEvents">0</span><span class="lbl">EVENTS</span></div>
    <div class="stat"><span class="num kept" id="stKept">0</span><span class="lbl">KEPT</span></div>
    <div class="stat"><span class="num skipped" id="stSkipped">0</span><span class="lbl">SKIPPED</span></div>
  </div>
</header>

<main id="workspace">
  <canvas id="networkCanvas"></canvas>
  <!-- Master Spider: the orchestrator (Muse agent). Not decorative. -->
  <div id="masterSpider" title="Muse — agent orchestrator">
    <svg viewBox="0 0 120 120" width="110" height="110">
      <g class="ms-legs" stroke="#35e0ff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
        <line x1="42" y1="38" x2="14" y2="22"/><line x1="40" y1="52" x2="8" y2="52"/>
        <line x1="42" y1="66" x2="14" y2="86"/><line x1="50" y1="78" x2="34" y2="104"/>
        <line x1="78" y1="38" x2="106" y2="22"/><line x1="80" y1="52" x2="112" y2="52"/>
        <line x1="78" y1="66" x2="106" y2="86"/><line x1="70" y1="78" x2="86" y2="104"/>
      </g>
      <ellipse cx="60" cy="46" rx="16" ry="18" fill="#081018" stroke="#35e0ff" stroke-width="2.5"/>
      <ellipse cx="60" cy="78" rx="12" ry="16" fill="#081018" stroke="#35e0ff" stroke-width="2.5"/>
      <circle cx="54" cy="42" r="3.5" fill="#ff4fd8" class="ms-eye"/>
      <circle cx="66" cy="42" r="3.5" fill="#ff4fd8" class="ms-eye"/>
      <circle id="msCore" cx="60" cy="60" r="5" fill="#35e0ff" opacity="0.9"/>
    </svg>
    <div id="msLabel">ORCHESTRATOR</div>
  </div>
  <div id="detailPanel" hidden>
    <button id="detailClose">×</button>
    <div id="detailTool">—</div>
    <div id="detailMeta">—</div>
    <div id="detailStatus">—</div>
  </div>
  <div id="emptyHint">waiting for agent activity…</div>
</main>

<footer id="jevbar">
  <span class="jev-q">is this tool worth visualizing?</span>
  <span class="jev-item" id="jevItem">—</span>
  <span class="jev-count"><b id="jevKept">0</b> KEPT</span>
  <span class="jev-count"><b id="jevSkipped">0</b> SKIPPED</span>
  <span id="connPill"><span id="connDot"></span><span id="connText">connecting</span></span>
</footer>

<div id="sessionPanel" hidden>
  <div id="sessionHead">SESSION SUMMARY</div>
  <div id="sessionStatus">—</div>
  <div id="sessionStats"></div>
  <button id="sessionClose">×</button>
</div>

<script src="app.js"></script>
</body>
</html>
