<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SWARM — SPIDER Telemetry</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="cosmos">
  <div id="spacePhoto"></div>
  <div id="nebulaDrift"></div>
</div>
<canvas id="swarmCanvas"></canvas>

<header id="statsbar">
  <div class="stat"><span class="num" id="stTools">0</span><span class="lbl">TOOLS</span></div>
  <div class="stat"><span class="num" id="stNodes">0</span><span class="lbl">NODES</span></div>
  <div class="stat"><span class="num" id="stTrails">0</span><span class="lbl">TRAILS</span></div>
  <div class="stat"><span class="num kept" id="stKept">0</span><span class="lbl">KEPT</span></div>
  <div class="stat"><span class="num skipped" id="stSkipped">0</span><span class="lbl">SKIPPED</span></div>
  <div class="stat brain"><span class="num" id="brainDot">●</span><span class="lbl" id="brainText">BRAIN IDLE</span></div>
</header>

<aside id="feed">
  <h2>Activity</h2>
  <ul id="feedList"></ul>
</aside>

<div id="connPill"><span id="connDot"></span><span id="connText">connecting</span></div>

<script src="app.js"></script>
</body>
</html>
