<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIDER — Agent Telemetry</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="twinkle"></div>
<div id="shooting"></div>
<div class="dust" style="width:90px;height:90px;top:22%;left:12%;animation-duration:30s;"></div>
<div class="dust" style="width:60px;height:60px;top:68%;left:78%;animation-duration:22s;"></div>
<div class="dust" style="width:120px;height:120px;top:45%;left:55%;animation-duration:36s;"></div>
<div id="stage">
  <svg id="web" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-label="SPIDER workspace">
    <defs>
      <radialGradient id="halo" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#d9a441" stop-opacity="0.20"/>
        <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="nodeGradient" cx="38%" cy="32%" r="72%">
        <stop offset="0%" stop-color="#4a5260" stop-opacity="0.92"/>
        <stop offset="46%" stop-color="#252b34" stop-opacity="0.90"/>
        <stop offset="100%" stop-color="#0e1116" stop-opacity="1"/>
      </radialGradient>
      <radialGradient id="nodeGradientActive" cx="38%" cy="32%" r="72%">
        <stop offset="0%" stop-color="#f0c56b" stop-opacity="0.88"/>
        <stop offset="38%" stop-color="#d9a441" stop-opacity="0.48"/>
        <stop offset="100%" stop-color="#15171b" stop-opacity="1"/>
      </radialGradient>
      <radialGradient id="nodeGradientDone" cx="38%" cy="32%" r="72%">
        <stop offset="0%" stop-color="#a9d3a2" stop-opacity="0.78"/>
        <stop offset="42%" stop-color="#7fae7a" stop-opacity="0.38"/>
        <stop offset="100%" stop-color="#101512" stop-opacity="1"/>
      </radialGradient>
      <radialGradient id="nodeGradientFailed" cx="38%" cy="32%" r="72%">
        <stop offset="0%" stop-color="#ef9a88" stop-opacity="0.84"/>
        <stop offset="42%" stop-color="#d96a5a" stop-opacity="0.44"/>
        <stop offset="100%" stop-color="#151111" stop-opacity="1"/>
      </radialGradient>
    </defs>
    <g id="ambient" aria-hidden="true"></g>
    <g id="spiderWeb"></g>
    <g id="threads"></g>
    <g id="nodes"></g>
    <g id="ripples"></g>
    <g id="spider" opacity="0">
      <circle id="spiderHalo" r="34" fill="url(#halo)"/>
      <g id="spiderBody" stroke="#e8e4d8" stroke-width="1.6" fill="none" stroke-linecap="round">
        <!-- L0: 8 articulated legs (hip->upper->knee->lower->ankle->foot->tip), built by JS -->
        <g id="legs"></g>
        <!-- abdomen: segmented plates -->
        <ellipse cx="0" cy="4" rx="7" ry="11" fill="#14161b" stroke="#e8e4d8"/>
        <line x1="-6.4" y1="1" x2="6.4" y2="1" stroke-width="1"/>
        <line x1="-6.8" y1="7" x2="6.8" y2="7" stroke-width="1"/>
        <circle cx="0" cy="-11" r="4.5" fill="#14161b" stroke="#e8e4d8"/>
        <circle cx="0" cy="-11" r="1.4" fill="#d9a441" stroke="none"/>
      </g>
    </g>
  </svg>
  <div id="vignette"></div>

  <header id="readout">
    <div class="brand">SPIDER <span>by Erlangga</span></div>
    <dl>
      <div><dt>agent</dt><dd id="roAgent">—</dd></div>
      <div><dt>task</dt><dd id="roTask">—</dd></div>
      <div><dt>step</dt><dd id="roStep">—</dd></div>
      <div><dt>tool</dt><dd id="roTool">—</dd></div>
      <div><dt>latest</dt><dd id="roLatest">—</dd></div>
    </dl>
    <div id="snapline">
      <span id="snapBadge" class="live">LIVE SNAPSHOT</span>
      <span id="snapMeta">—</span>
      <span id="connDot" title="realtime connection"></span><span id="connText" title="realtime connection">CONNECTING</span><span id="queuePill" title="visual event queue" hidden></span>
    </div>
    <div id="bridgeNote" hidden>BRIDGE OBSERVER · posisi &amp; step mengikuti aktivitas non-SYSTEM terakhir</div>
    <div id="note">LIVE WebSocket · state.json fallback</div>
  </header>

  <aside id="feed">
    <div class="feed-title">activity</div>
    <ul id="feedList"></ul>
  </aside>

  <div id="offline" hidden>NO DATA — cannot reach state.json</div>
</div>
<script src="app.js?v=20261009-8"></script>
</body>
</html>
